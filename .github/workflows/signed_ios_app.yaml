name: Signed Ios App
on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        options:
          - Release
          - Debug
        default: Debug
        description: Release Type

jobs:
  build_debug_ios_app:
    name: Build iOS App
    if: ${{ inputs.build_type == 'Debug' }}
    runs-on: macos-latest

    steps:
      - name: Set XCode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode_version: latest-stable

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build iOS App
        uses: HekmatullahAmin/mifos-x-actionhub-build-ios-app@enhance-ios-build-action

  build_signed_ios_app:
    name: Build signed iOS app
    if: ${{ inputs.build_type == 'Release' }}
    runs-on: macos-latest

    steps:
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode_version: latest-stable

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build singed iOS App
        uses: HekmatullahAmin/mifos-x-actionhub-build-ios-app@enhance-ios-build-action
        with:
          build_type: 'Release'
          app_identifier: 'org.mifos.kmp.template'
          git_url: 'git@github.com:openMF/ios-provisioning-profile.git'
          git_branch: 'master'
          match_type: 'adhoc'
          provisioning_profile_name: 'match AdHoc org.mifos.kmp.template'
          appstore_key_id: ${{ secrets.APPSTORE_KEY_ID }}
          appstore_issuer_id: ${{ secrets.APPSTORE_ISSUER_ID }}
          appstore_auth_key: ${{ secrets.APPSTORE_AUTH_KEY }}
          match_password: ${{ secrets.MATCH_PASSWORD }}
          match_ssh_private_key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}